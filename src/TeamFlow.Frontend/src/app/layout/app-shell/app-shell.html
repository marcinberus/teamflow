<a class="skip-link" href="#main-content">Skip to main content</a>

<mat-sidenav-container>
  <mat-sidenav
    #navigation
    [fixedInViewport]="isSmallScreen()"
    [mode]="isSmallScreen() ? 'over' : 'side'"
    [opened]="!isSmallScreen()"
    aria-label="Primary navigation"
  >
    <a class="brand" routerLink="/projects" (click)="closeNavigation(navigation)">
      <span class="brand-mark" aria-hidden="true">T</span>
      <span>TeamFlow</span>
    </a>

    <mat-nav-list aria-label="Main">
      <a
        class="nav-link"
        mat-list-item
        routerLink="/projects"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        (click)="closeNavigation(navigation)"
      >
        <mat-icon matListItemIcon aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M10 4H2v16h20V6H12l-2-2Zm10 14H4V8h16v10Z" />
          </svg>
        </mat-icon>
        <span matListItemTitle>Projects</span>
      </a>

      <a
        class="nav-link"
        mat-list-item
        routerLink="/imports/projects"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        (click)="closeNavigation(navigation)"
      >
        <mat-icon matListItemIcon aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M5 20h14v-2H5v2ZM19 9h-4V3H9v6H5l7 7 7-7Z" />
          </svg>
        </mat-icon>
        <span matListItemTitle>Import</span>
      </a>

      <a
        class="nav-link"
        mat-list-item
        routerLink="/profile"
        routerLinkActive="active-link"
        ariaCurrentWhenActive="page"
        (click)="closeNavigation(navigation)"
      >
        <mat-icon matListItemIcon aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path
              d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"
            />
          </svg>
        </mat-icon>
        <span matListItemTitle>Profile</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar>
      @if (isSmallScreen()) {
        <button
          mat-icon-button
          type="button"
          aria-label="Open navigation"
          (click)="navigation.open()"
        >
          <mat-icon aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z" />
            </svg>
          </mat-icon>
        </button>
      }

      <span class="toolbar-title">Workspace</span>
      <span class="toolbar-spacer"></span>

      <button
        mat-icon-button
        type="button"
        [matMenuTriggerFor]="accountMenu"
        aria-label="Open account menu"
      >
        <mat-icon aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path
              d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"
            />
          </svg>
        </mat-icon>
      </button>
    </mat-toolbar>

    <main id="main-content" class="shell-content" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

<mat-menu #accountMenu="matMenu">
  <a mat-menu-item routerLink="/profile">
    <mat-icon aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false">
        <path
          d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"
        />
      </svg>
    </mat-icon>
    <span>Profile</span>
  </a>
  <a mat-menu-item routerLink="/login">
    <mat-icon aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false">
        <path
          d="M10 17v-3H3v-4h7V7l5 5-5 5Zm9-14h-7v2h7v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2Z"
        />
      </svg>
    </mat-icon>
    <span>Log out</span>
  </a>
</mat-menu>
